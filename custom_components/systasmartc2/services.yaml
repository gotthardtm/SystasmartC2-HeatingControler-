set_heating_temperature:
  name: Heizkreis Solltemperatur setzen
  description: Setzt die Solltemperatur für einen Heizkreis.
  target:
    entity:
      domain: climate
  fields:
    circuit:
      name: Heizkreis
      description: Der Heizkreis (1 oder 2).
      required: true
      selector:
        select:
          options:
            - "1"
            - "2"
    temperature:
      name: Temperatur
      description: Die Solltemperatur in °C.
      required: true
      selector:
        number:
          min: 5
          max: 80
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

set_dhw_temperature:
  name: Warmwasser Solltemperatur setzen
  description: Setzt die Solltemperatur für Warmwasser.
  target:
    entity:
      domain: water_heater
  fields:
    temperature:
      name: Temperatur
      description: Die Solltemperatur in °C.
      required: true
      selector:
        number:
          min: 10
          max: 70
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

control_dhw:
  name: Warmwasser steuern
  description: Aktiviert oder deaktiviert die Warmwasserbereitung.
  target:
    entity:
      domain: water_heater
  fields:
    enable:
      name: Aktivieren
      description: Warmwasserbereitung aktivieren (true) oder deaktivieren (false).
      required: true
      default: true
      selector:
        boolean:
